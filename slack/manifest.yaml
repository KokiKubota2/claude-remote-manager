# Slack App Manifest — https://api.slack.com/apps で "From an app manifest" を選んで貼り付ける
display_information:
  name: Claude Remote
  description: Claude Codeジョブの通知・許可・追加指示
  background_color: "#1a1a2e"
features:
  bot_user:
    display_name: claude-remote
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.public
settings:
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
